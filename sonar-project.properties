# SonarQube Project Configuration - zxt-next
# Server: set SONAR_HOST_URL in the environment for local/CI scans
# Project Key: zxt-next

sonar.projectKey=zxt-next
sonar.projectName=zxt-next
sonar.host.url=${env.SONAR_HOST_URL}

# Source paths
sonar.sources=apps/admin/src,apps/admin/app,apps/mobile/src,apps/mobile/app,apps/api/app,apps/api/src,packages

# Exclusions: build output, dependencies, temp files, scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.worktrees/**,**/.scannerwork/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/__pycache__/**,**/*.py

# Language: TypeScript/JavaScript
sonar.javascript.lcov.reportPaths=
sonar.typescript.lcov.reportPaths=

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.disabled=true
